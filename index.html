<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>茶包製作時程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f0; --card:#ffffff; --ink:#1f2a22; --muted:#6a726b; --line:#e3e6df;
  --deep:#24452c; --deep-2:#2f5a39; --soft:#e9f0e4; --soft-2:#f1f5ee;
  --p1:#3f7a4a; --p2:#b5832f; --p3:#8f3e2c; --p4:#b84a5f; --p5:#3d7eaf; --p6:#8b918d;
  --k1:#e8f0e6; --k2:#e1edf8; --k3:#fbeee0; --k4:#f9e3e3;
  --input:#fbf8e8; --rose:#fbf0ee;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.55;
  background:var(--bg) radial-gradient(1200px 500px at 85% -10%,#e7efe0 0,transparent 60%) no-repeat}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 48px;position:relative}
/* hero */
header{position:relative;padding:34px 0 18px;min-height:190px}
.hero-img{position:absolute;right:-16px;top:0;width:520px;max-width:46%;height:188px;object-fit:cover;object-position:right;
  -webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.6) 30%,#000 50%);mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.6) 30%,#000 50%);pointer-events:none;border-radius:0 0 0 0}
header h1{position:relative;margin:0 0 10px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,5vw,54px);letter-spacing:.06em;color:var(--deep)}
header p{position:relative;margin:0;color:var(--deep-2);font-size:clamp(14px,1.6vw,18px);letter-spacing:.05em}
header p .sep{margin:0 14px;color:#9aa79b}
/* tabs */
.tabs{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tabs button{border:0;font:inherit;font-weight:500;letter-spacing:.08em;padding:9px 26px;border-radius:8px;cursor:pointer;
  background:#eceee8;color:var(--ink);transition:background .15s}
.tabs button:hover{background:#e0e6da}
.tabs button.on{background:var(--deep);color:#fff;box-shadow:0 3px 8px rgba(36,69,44,.25)}
/* cards */
.card{background:var(--soft-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(30,50,30,.05)}
.card-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:21px;font-weight:700;letter-spacing:.08em;color:var(--deep)}
.card-h svg{width:26px;height:26px;fill:var(--deep)}
.card.dark{padding:0;overflow:hidden;background:var(--card)}
.card.dark .card-h{background:var(--deep);color:#fff;margin:0;padding:12px 18px}
.card.dark .card-h svg{fill:#fff}
.inner{background:var(--card);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;position:relative;overflow:hidden}
.inner .leaf{position:absolute;right:10px;bottom:-6px;width:80px;opacity:.35}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink);font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid #e6e1c8;border-radius:7px;padding:6px 10px}
#gStart{font-size:17px;padding:7px 12px;min-width:230px}
input[type=number]{width:66px;text-align:center}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px}
.note i{flex:none;width:22px;height:22px;border-radius:50%;background:#7c837d;color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center;font-size:13px;margin-top:1px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.kpi{border-radius:12px;padding:18px 18px;display:flex;align-items:center;gap:16px;min-height:100px}
.kpi svg.ic{flex:none;width:50px;height:50px}
.kpi .t{font-size:14px;color:var(--ink);white-space:nowrap}
.kpi .v{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kpi b{font-size:30px;line-height:1.2;letter-spacing:.02em}
.kpi .wk{font-size:13px;padding:2px 14px;border-radius:999px}
.kpi.k1{background:var(--k1)} .kpi.k1 svg{fill:var(--p1)} .kpi.k1 .wk{background:#cfe2cc;color:var(--deep)}
.kpi.k2{background:var(--k2)} .kpi.k2 svg{fill:#1f2a33} .kpi.k2 .wk{background:#c3dcf2;color:#1f4b72}
.kpi.k3{background:var(--k3)} .kpi.k3 svg{fill:#c26f22} .kpi.k3 b{color:#9b2e1e}
.kpi.k4{background:var(--k4)} .kpi.k4 svg{fill:#a33a37} .kpi.k4 b{color:#a33a37}
.ring{margin-left:auto;flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.ring span{width:49px;height:49px;border-radius:50%;background:var(--k4);display:grid;place-items:center}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;text-align:left;vertical-align:middle}
td{border-bottom:1px solid var(--line)}
td.c,th.c{text-align:center}
td.date{white-space:nowrap;text-align:center}
.prog th{color:#fff;font-weight:700;white-space:nowrap;letter-spacing:.02em;padding:12px 8px;background:var(--deep);font-size:14px}
.prog td{padding:9px 6px}
.prog th .hi svg{width:17px;height:17px;fill:#fff}
.prog th.chev{position:relative;padding-left:18px;padding-right:18px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}
.prog th.chev.first{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.prog th .hi{display:inline-flex;align-items:center;gap:7px}
.prog th .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;font-size:12px}
.ph1{background:var(--p1)!important}.ph2{background:var(--p2)!important}.ph3{background:var(--p3)!important}.ph4{background:var(--p4)!important}.ph5{background:var(--p5)!important}.ph6{background:var(--p6)!important}
.ph1 .num{color:var(--p1)}.ph2 .num{color:var(--p2)}.ph3 .num{color:var(--p3)}.ph4 .num{color:var(--p4)}.ph5 .num{color:var(--p5)}
.prog td{font-size:14px}
.prod{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.prod .em{font-size:20px}
.prod a{color:inherit;text-decoration:none}.prod a:hover{text-decoration:underline}
.badge{display:inline-block;padding:3px 14px;border-radius:999px;font-size:14px;white-space:nowrap;border:1px solid transparent}
.st-未開始{background:#f0f1ee;border-color:#dcdfd9}.st-進行中{background:#dbeaf7;border-color:#bcd6ee}.st-完成,.st-已完工{background:#dcedd6;border-color:#bcdcb1}.st-延遲,.st-有延遲{background:#f8dcd2;border-color:#efbcaa}
.std th{background:var(--deep);color:#fff;font-weight:700;padding:7px 12px}
.std td{padding:5px 12px;border-bottom:0}
.std tr:nth-child(odd) td{background:var(--rose)}
.std tr.tot td{background:#fff;border-top:1px solid var(--line);font-weight:700}
.circ{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;margin-right:12px}
.c1{background:var(--p1)}.c2{background:var(--p2)}.c3{background:var(--p3)}.c4{background:var(--p4)}.c5{background:var(--p5)}
.late{color:#c0392b!important;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.pri{background:var(--deep);color:#fff;border-color:var(--deep)}
.pad{padding:14px 18px}
/* product table */
.ptab th{background:var(--deep);color:#fff;font-weight:700;white-space:nowrap;padding:10px}
.ptab td{background:#fff}
.ptab td.phc{border-left:5px solid;white-space:nowrap;min-width:180px}
.ptab td.itm{min-width:200px}
.ptab td{padding:8px 7px}
.ptab input[type=date]{font-size:13px;padding:5px 6px;width:138px}
.ptab select{font-size:13px}
/* gantt */
.gantt{border-collapse:separate;border-spacing:0;font-size:12px;width:auto}
.gantt th,.gantt td{border:0;border-bottom:1px solid var(--line);padding:0}
.gantt th.lbl,.gantt td.lbl{position:sticky;left:0;background:#fff;padding:5px 12px;white-space:nowrap;z-index:1;min-width:230px;text-align:left;font-size:13px}
.gantt th.d{background:#fff;color:var(--muted);font-weight:400;width:26px;min-width:26px;text-align:center;font-size:11px;line-height:1.15;padding:5px 0}
.gantt th.d.mon{border-left:1px solid var(--line)}
.gantt th.d b{color:var(--deep)}
.gantt td.cell{height:28px;width:26px}
.gantt td.off{background:#efefea}
.gantt td.on.first{border-radius:6px 0 0 6px}.gantt td.on.last{border-radius:0 6px 6px 0}.gantt td.on.first.last{border-radius:6px}
.gantt td.today{box-shadow:inset 2px 0 0 #d0742c}
.gantt tr.grp td{background:var(--soft)}
.gantt tr.grp td.lbl{font-weight:700;background:var(--soft);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:0 18px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.hidden{display:none}
footer{margin-top:24px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
@media print{.tabs,.noprint{display:none!important}.view.hidden{display:block!important}.card{break-inside:avoid}body{background:#fff}}
@media (max-width:760px){.hero-img{opacity:.35;max-width:80%}.tabs button{padding:8px 14px}.kpi b{font-size:24px}}
</style>
</head>

function defaults(){
  return {
    start:"2026-10-12",
    std:TASKS.map(t=>t.d),
    holidays:[
      {d:"2026-10-09",n:"國慶日補假（10/10 逢週六）"},
      {d:"2026-10-26",n:"臺灣光復節補假（10/25 逢週日）"},

      {d:"2027-01-01",n:"開國紀念日"},
    ],
    prod:Object.fromEntries(PRODUCTS.map(p=>[p,{start:"",rows:TASKS.map(t=>({days:"",unit:t.unit,as:"",ae:"",st:"未開始",note:""}))}]))
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const pd=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:"";
const WK="日一二三四五六";
const show=d=>d?`${d.getMonth()+1}/${d.getDate()}（${WK[d.getDay()]}）`:"—";
const big=d=>d?`${d.getMonth()+1}/${d.getDate()}（${WK[d.getDay()]}）`:"—";
const holSet=()=>new Set(S.holidays.map(h=>h.d).filter(Boolean));
function isWork(d,H){const w=d.getDay();return w!==0&&w!==6&&!H.has(fmt(d))}
function nextWork(d,H){const x=new Date(d);while(!isWork(x,H))x.setDate(x.getDate()+1);return x}
function addWork(d,n,H){const x=nextWork(d,H);let k=n;while(k>0){x.setDate(x.getDate()+1);if(isWork(x,H))k--}return x}
function plan(p){
  const H=holSet(),P=S.prod[p];
  let cur=pd(P.start||S.start);if(!cur)return[];
  return TASKS.map((t,i)=>{
    const days=Math.max(1,Number(P.rows[i].days||S.std[i])||1);
    const s=nextWork(cur,H),e=addWork(s,days-1,H);
    cur=new Date(e);cur.setDate(cur.getDate()+1);
    return{days,s,e};
  });
}
function prodStatus(p){
  const r=S.prod[p].rows.map(x=>x.st);
  if(r.every(x=>x==="完成"))return"已完工";
  if(r.includes("延遲"))return"有延遲";
  if(r.every(x=>x==="未開始"))return"未開始";
  return"進行中";
}

function vOverview(){
  const plans=PRODUCTS.map(plan);

  const all=PRODUCTS.length*TASKS.length, pct=Math.round(done/all*100);

  </section>
  <section class="kpis">
    <div class="kpi k1">${I.cal}<div><div class="t">開工日</div><div class="v"><b>${st?`${st.getMonth()+1}/${st.getDate()}`:"—"}</b>${st?`<span class="wk">週${WK[st.getDay()]}</span>`:""}</div></div></div>
    <div class="kpi k2">${I.flag}<div><div class="t">全部預計完工</div><div class="v"><b>${last?`${last.getMonth()+1}/${last.getDate()}`:"—"}</b>${last?`<span class="wk">週${WK[last.getDay()]}</span>`:""}</div></div></div>
    <div class="kpi k3">${I.clock}<div><div class="t">標準作業天數</div><div class="v"><b>${total} 個工作天</b></div></div></div>
    <div class="kpi k4">${I.cube}<div><div class="t">已完成作業項目</div><div class="v"><b>${done} / ${all}</b></div></div>
      <div class="ring" style="background:conic-gradient(#a33a37 ${pct*3.6}deg,#d9d9d6 0)"><span>${pct}%</span></div></div>
  </section>
  <section class="card dark">${hdr("doc","各產品進度")}
    <div class="scroll"><table class="prog">
    <tr><th>產品</th><th class="c">開工日</th>
      ${PHASES.map((ph,k)=>`<th class="c chev ph${ph.n} ${k===0?"first":""}"><span class="hi">${I[ph.ic]}<span class="num">${ph.n}</span>${ph.t}</span></th>`).join("")}
      <th class="c chev ph6">已完成</th><th class="c">狀態</th></tr>
    ${PRODUCTS.map((p,i)=>{const pl=plans[i];if(!pl.length)return"";const s=prodStatus(p);
      return `<tr><td><span class="prod"><span class="em">${EMOJI[p]}</span><a href="#" data-go="${p}">${p}</a></span></td>
      <td class="date">${show(pl[0].s)}</td>
      ${PEND.map(k=>`<td class="date">${show(pl[k].e)}</td>`).join("")}
      <td class="c">${S.prod[p].rows.filter(r=>r.st==="完成").length} / ${TASKS.length}</td>
      <td class="c"><span class="badge st-${s}">${s}</span></td></tr>`}).join("")}
    </table></div>
  </section>
  <section class="card">${hdr("bars","標準作業天數（工作天）")}
    <div class="scroll"><table class="std">
    <tr><th>階段</th><th>作業項目</th><th class="c">天數</th></tr>
    ${TASKS.map((t,i)=>`<tr><td><span class="circ c${t.p}">${t.p}</span>${t.ph.replace(/^\d\.\s*/,"")}</td><td>${t.it}</td>
      <td class="c"><input type="number" min="1" data-std="${i}" value="${S.std[i]}"></td></tr>`).join("")}
    <tr class="tot"><td></td><td>合計</td><td class="c">${total}</td></tr>
    </table></div>
    <p class="muted" style="margin:10px 2px 0">天數由使用者提供，包裝天數暫定 2 天。各產品頁預設帶入此表，也可在產品頁個別修改；天數未含各廠之間的運送時間。</p>
  </section>`;
}
function vProduct(p){
  const P=S.prod[p],pl=plan(p);
  return `<section class="card">${hdr("gear",`${EMOJI[p]} ${p}　製作時程表`)}
    <div class="inner">
      <label class="f">本產品開工日<input type="date" data-pstart="${p}" value="${P.start||S.start}"></label>
      ${P.start?`<button class="btn" data-pclear="${p}">改回與總覽相同</button>`:`<div class="note"><i>i</i><div>預設同總覽開工日；如需錯開可直接修改。</div></div>`}
      <div style="margin-left:auto;text-align:right"><div class="muted">預計完工</div><b style="font-size:24px;color:var(--deep)">${pl.length?big(pl[5].e):"—"}</b></div>
    </div>
  </section>
  <section class="card dark">${hdr("doc","作業明細")}
    <div class="scroll"><table class="ptab">
    <tr><th>階段</th><th>作業項目</th><th>負責單位</th><th class="c">天數</th><th class="c">預計開始</th><th class="c">預計完成</th><th class="c">實際開始</th><th class="c">實際完成</th><th class="c">狀態</th><th>備註</th></tr>
    ${TASKS.map((t,i)=>{const r=P.rows[i],x=pl[i];const late=r.ae&&x&&pd(r.ae)>x.e;
      return `<tr>
      <td class="phc" style="border-left-color:var(--p${t.p})"><span class="circ c${t.p}">${t.p}</span>${t.ph.replace(/^\d\.\s*/,"")}</td><td class="itm">${t.it}</td>
      <td><input data-p="${p}" data-i="${i}" data-k="unit" value="${esc(r.unit)}" style="width:110px"></td>
      <td class="c"><input type="number" min="1" data-p="${p}" data-i="${i}" data-k="days" value="${r.days||S.std[i]}"></td>
      <td class="date">${x?show(x.s):"—"}</td><td class="date">${x?show(x.e):"—"}</td>
      <td class="c"><input type="date" data-p="${p}" data-i="${i}" data-k="as" value="${r.as}"></td>
      <td class="c"><input type="date" class="${late?"late":""}" data-p="${p}" data-i="${i}" data-k="ae" value="${r.ae}"></td>
      <td class="c"><select data-p="${p}" data-i="${i}" data-k="st" class="badge st-${r.st}">${STATUSES.map(s=>`<option ${s===r.st?"selected":""}>${s}</option>`).join("")}</select></td>
      <td><input data-p="${p}" data-i="${i}" data-k="note" value="${esc(r.note)}" style="width:120px"></td></tr>`}).join("")}
    </table></div>
    <p class="muted pad" style="margin:0">填入實際開始會自動標為「進行中」，填入實際完成會標為「完成」；實際完成晚於預計時以紅字顯示。修改本頁天數只影響此產品。</p>
  </section>`;
}
function vGantt(){
  const H=holSet(),plans=PRODUCTS.map(plan);
  let lo=null,hi=null;plans.forEach(pl=>pl.forEach(x=>{if(!lo||x.s<lo)lo=x.s;if(!hi||x.e>hi)hi=x.e}));
  if(!lo)return`<section class="card">請先設定開工日。</section>`;
  const days=[];for(let d=new Date(lo);d<=hi;d.setDate(d.getDate()+1))days.push(new Date(d));
  const today=fmt(new Date());
  const head=days.map((d,k)=>`<th class="d ${d.getDate()===1||k===0?"mon":""}">${d.getDate()===1||k===0?`<b>${d.getMonth()+1}月</b><br>`:""}${d.getDate()}<br>${WK[d.getDay()]}</th>`).join("");
  let body="";
  PRODUCTS.forEach((p,pi)=>{
    body+=`<tr class="grp"><td class="lbl">${EMOJI[p]} ${p}　<span class="muted">完工 ${show(plans[pi][5].e)}</span></td>${days.map(()=>`<td class="cell"></td>`).join("")}</tr>`;
    TASKS.forEach((t,i)=>{const x=plans[pi][i];
      body+=`<tr><td class="lbl">${t.it}</td>${days.map(d=>{const on=d>=x.s&&d<=x.e&&isWork(d,H);const off=!isWork(d,H);
        const cls=["cell",on?"on":off?"off":"",fmt(d)===fmt(x.s)?"first":"",fmt(d)===fmt(x.e)?"last":"",fmt(d)===today?"today":""].join(" ");
        return`<td class="${cls}" ${on?`style="background:var(--p${t.p})" title="${t.it}：${show(x.s)}–${show(x.e)}"`:""}></td>`}).join("")}</tr>`;
    });
  });
  return `<section class="card dark">${hdr("bars","四項產品甘特圖")}
  <div class="legend" style="margin-top:12px">${PHASES.map(ph=>`<span><i style="background:var(--p${ph.n})"></i>${ph.n}. ${ph.t.replace("完成","")}</span>`).join("")}<span><i style="background:#efefea;border:1px solid #ddd"></i>週末／假日</span></div>
  <div class="scroll"><table class="gantt"><tr><th class="lbl">作業項目</th>${head}</tr>${body}</table></div></section>`;
}
function vHolidays(){
  return `<section class="card dark">${hdr("cal".replace("cal","doc"),"國定假日／不作業日")}
  <div class="pad"><p class="muted" style="margin:0 0 10px">排程會自動跳過以下日期。請依行政院人事行政總處公告及各代工廠實際休假增修。</p>
  <table class="std" style="max-width:600px"><tr><th>日期</th><th>說明</th><th class="c noprint"></th></tr>
  ${S.holidays.map((h,i)=>`<tr><td><input type="date" data-h="${i}" data-hk="d" value="${h.d}"></td><td><input data-h="${i}" data-hk="n" value="${esc(h.n)}" style="width:100%"></td><td class="c noprint"><button class="btn" data-hdel="${i}">刪除</button></td></tr>`).join("")}
  </table><p class="noprint"><button class="btn pri" id="hAdd">＋ 新增日期</button></p></div></section>`;
}
function render(){
  renderTabs();
  $("#views").innerHTML=VIEWS.map(v=>{
    const inner=v==="總覽"?vOverview():v==="甘特圖"?vGantt():v==="國定假日"?vHolidays():vProduct(v);
    return `<div class="view ${v===cur?"":"hidden"}" data-view="${v}">${inner}</div>`;
  }).join("");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-go],[data-pclear],[data-hdel],#hAdd,#printBtn,#resetBtn");if(!t)return;
  if(t.dataset.v){cur=t.dataset.v;try{sessionStorage.setItem(KEY+"tab",cur)}catch(_){}render();window.scrollTo(0,0)}
  else if(t.dataset.go){e.preventDefault();cur=t.dataset.go;render()}
  else if(t.dataset.pclear){S.prod[t.dataset.pclear].start="";save();render()}
  else if(t.dataset.hdel){S.holidays.splice(+t.dataset.hdel,1);save();render()}
  else if(t.id==="hAdd"){S.holidays.push({d:"",n:""});save();render()}
  else if(t.id==="printBtn"){window.print()}
  else if(t.id==="resetBtn"){if(confirm("確定要清除所有填寫內容並恢復預設值？")){S=defaults();save();render()}}
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="gStart")S.start=t.value;
  else if(d.std!==undefined)S.std[+d.std]=Math.max(1,+t.value||1);
  else if(d.pstart){S.prod[d.pstart].start=t.value===S.start?"":t.value}
  else if(d.p){const r=S.prod[d.p].rows[+d.i];
    if(d.k==="days")r.days=(+t.value===S.std[+d.i]||!t.value)?"":Math.max(1,+t.value);
    else r[d.k]=t.value;
    if(d.k==="ae"&&t.value&&r.st!=="完成")r.st="完成";
    if(d.k==="as"&&t.value&&r.st==="未開始")r.st="進行中";
  }
  else if(d.h!==undefined){S.holidays[+d.h][d.hk]=t.value}
  else return;
  save();render();
});
render();
</script>
</body>
</html>
